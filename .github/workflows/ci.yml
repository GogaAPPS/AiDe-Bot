name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main

env:
  GO_VERSION: ${{ vars.GO_VERSION || '1.24.x' }}
  BUILD_CONTEXT: ${{ vars.BUILD_CONTEXT || '.' }}
  DOCKERFILE_PATH: ${{ vars.DOCKERFILE_PATH || 'Dockerfile' }}

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || github.event.deleted != true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Check go.mod and go.sum
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Run checks
        run: make check

      - name: Run race tests
        run: go test -race ./...

      - name: Validate Docker Compose config
        run: docker compose config --quiet

      - name: Install YAML parser
        run: python -m pip install --upgrade pyyaml

      - name: Validate Deployfile YAML
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          with Path("Deployfile.yml").open() as file:
              yaml.safe_load(file)

          print("Deployfile.yml: ok")
          PY

      - name: Validate Kubernetes manifests
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          for path in sorted(Path("k8s").glob("*.yaml")):
              with path.open() as file:
                  yaml.safe_load(file)
              print(f"{path}: ok")
          PY

  build:
    name: Docker build
    runs-on: ubuntu-latest
    needs:
      - quality

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.BUILD_CONTEXT }}
          file: ${{ env.DOCKERFILE_PATH }}
          push: false
          tags: aide-bot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
