name: CD

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        type: choice
        required: true
        default: preproduction
        options:
          - preproduction
          - production
      image_tag:
        description: "Optional image tag override"
        type: string
        required: false

env:
  GO_VERSION: ${{ vars.GO_VERSION || '1.24.x' }}
  REGISTRY: ${{ vars.REGISTRY || 'ghcr.io' }}
  IMAGE_NAME: ${{ vars.IMAGE_NAME || 'aide-bot' }}
  BUILD_CONTEXT: ${{ vars.BUILD_CONTEXT || '.' }}
  DOCKERFILE_PATH: ${{ vars.DOCKERFILE_PATH || 'Dockerfile' }}
  K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE || 'apps' }}
  K8S_DEPLOYMENT: ${{ vars.K8S_DEPLOYMENT || 'aide-bot' }}
  K8S_CONTAINER: ${{ vars.K8S_CONTAINER || 'aide-bot' }}
  KUBECONFIG: ${{ vars.KUBECONFIG || '/home/github-runner/.kube/config' }}

permissions:
  contents: read
  packages: write

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run checks
        run: make check

  build:
    name: Build and publish image
    runs-on: ubuntu-latest
    needs:
      - quality

    outputs:
      image: ${{ steps.image.outputs.image }}
      version: ${{ steps.image.outputs.version }}
      image_ref: ${{ steps.image.outputs.image_ref }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare image names
        id: image
        run: |
          OWNER="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          IMAGE="${REGISTRY}/${OWNER}/${IMAGE_NAME}"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.image_tag }}" ]; then
            VERSION="${{ github.event.inputs.image_tag }}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="${GITHUB_REF_NAME}-${GITHUB_SHA::7}"
          fi

          IMAGE_REF="${IMAGE}:${VERSION}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "image_ref=${IMAGE_REF}" >> "$GITHUB_OUTPUT"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "IMAGE_REF=${IMAGE_REF}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.BUILD_CONTEXT }}
          file: ${{ env.DOCKERFILE_PATH }}
          push: true
          tags: |
            ${{ steps.image.outputs.image_ref }}
            ${{ steps.image.outputs.image }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deployment summary
        run: |
          echo "Image: $IMAGE_REF"

  deploy:
    name: Deploy to K3s
    runs-on:
      - self-hosted
      - linux
      - x64
      - k3s-deploy
    needs:
      - build
    if: github.event_name == 'workflow_dispatch'
    environment: ${{ github.event.inputs.environment || 'production' }}
    concurrency:
      group: k3s-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'production' }}-${{ vars.K8S_DEPLOYMENT || 'aide-bot' }}
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Kubernetes access
        run: |
          set -Eeuo pipefail
          kubectl auth can-i update deployments -n "$K8S_NAMESPACE"
          kubectl auth can-i create configmaps -n "$K8S_NAMESPACE"

      - name: Apply manifests
        run: |
          set -Eeuo pipefail
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/deployment.yaml

      - name: Deploy image
        env:
          IMAGE: ${{ needs.build.outputs.image_ref }}
        run: |
          set -Eeuo pipefail
          scripts/deploy-k8s.sh

      - name: Deployment summary
        run: |
          echo "Environment: ${{ github.event.inputs.environment || 'production' }}"
          echo "Image: ${{ needs.build.outputs.image_ref }}"
          echo "Namespace: $K8S_NAMESPACE"
          echo "Deployment: $K8S_DEPLOYMENT"
