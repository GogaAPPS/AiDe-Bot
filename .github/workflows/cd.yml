name: CD

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch or tag to build and deploy"
        type: string
        required: true
        default: main
      environment:
        description: "Target environment"
        type: choice
        required: true
        default: preproduction
        options:
          - preproduction
          - production
      image_tag:
        description: "Optional image tag override"
        type: string
        required: false

env:
  GO_VERSION: ${{ vars.GO_VERSION || '1.24.x' }}
  REGISTRY: ${{ vars.REGISTRY || 'ghcr.io' }}
  IMAGE_NAME: ${{ vars.IMAGE_NAME || 'aide-bot' }}
  BUILD_CONTEXT: ${{ vars.BUILD_CONTEXT || '.' }}
  DOCKERFILE_PATH: ${{ vars.DOCKERFILE_PATH || 'Dockerfile' }}
  K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE || 'apps' }}
  K8S_DEPLOYMENT: ${{ vars.K8S_DEPLOYMENT || 'aide-bot' }}
  K8S_CONTAINER: ${{ vars.K8S_CONTAINER || 'aide-bot' }}
  KUBECONFIG: ${{ vars.KUBECONFIG || '/home/github-runner/.kube/config' }}

permissions:
  contents: read
  packages: write

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.branch || github.ref_name }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run checks
        run: make check

  build:
    name: Build and publish image
    runs-on: ubuntu-latest
    needs:
      - quality

    outputs:
      image: ${{ steps.image.outputs.image }}
      version: ${{ steps.image.outputs.version }}
      image_ref: ${{ steps.image.outputs.image_ref }}
      commit_sha: ${{ steps.image.outputs.commit_sha }}
      short_sha: ${{ steps.image.outputs.short_sha }}
      ref_name: ${{ steps.image.outputs.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.branch || github.ref_name }}

      - name: Prepare image names
        id: image
        env:
          REF_NAME: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.branch || github.ref_name }}
          IMAGE_TAG_OVERRIDE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.image_tag || '' }}
        run: |
          set -Eeuo pipefail

          sanitize_tag() {
            local value="$1"
            local max_length="${2:-128}"
            value="${value//\//-}"
            value="$(printf '%s' "$value" | tr -c 'A-Za-z0-9_.-' '-')"
            value="$(printf '%s' "$value" | sed -E 's/-+/-/g; s/^[.-]+//; s/[.-]+$//')"
            value="${value:0:$max_length}"
            value="$(printf '%s' "$value" | sed -E 's/[.-]+$//')"

            if [ -z "$value" ]; then
              echo "Docker image tag is empty after sanitization" >&2
              exit 1
            fi

            printf '%s' "$value"
          }

          OWNER="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          IMAGE="${REGISTRY}/${OWNER}/${IMAGE_NAME}"
          COMMIT_SHA="$(git rev-parse HEAD)"
          SHORT_SHA="${COMMIT_SHA::7}"

          if [ -n "$IMAGE_TAG_OVERRIDE" ]; then
            VERSION="$(sanitize_tag "$IMAGE_TAG_OVERRIDE")"
          else
            MAX_REF_LENGTH=$((128 - 1 - ${#SHORT_SHA}))
            SANITIZED_REF="$(sanitize_tag "$REF_NAME" "$MAX_REF_LENGTH")"
            VERSION="$(sanitize_tag "${SANITIZED_REF}-${SHORT_SHA}")"
          fi

          IMAGE_REF="${IMAGE}:${VERSION}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "image_ref=${IMAGE_REF}" >> "$GITHUB_OUTPUT"
          echo "commit_sha=${COMMIT_SHA}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "ref_name=${REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "IMAGE_REF=${IMAGE_REF}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.BUILD_CONTEXT }}
          file: ${{ env.DOCKERFILE_PATH }}
          push: true
          tags: |
            ${{ steps.image.outputs.image_ref }}
            ${{ steps.image.outputs.image }}:sha-${{ steps.image.outputs.commit_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deployment summary
        run: |
          echo "Image: $IMAGE_REF"

  deploy:
    name: Deploy to K3s
    runs-on:
      - self-hosted
      - linux
      - x64
      - k3s-deploy
    needs:
      - build
    if: github.event_name == 'workflow_dispatch'
    environment: ${{ github.event.inputs.environment || 'production' }}
    concurrency:
      group: k3s-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'production' }}-${{ vars.K8S_DEPLOYMENT || 'aide-bot' }}
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.ref_name }}

      - name: Validate Kubernetes access
        run: |
          set -Eeuo pipefail
          for verb in get create patch update; do
            kubectl auth can-i "$verb" deployments.apps -n "$K8S_NAMESPACE"
            kubectl auth can-i "$verb" configmaps -n "$K8S_NAMESPACE"
          done

      - name: Apply manifests
        env:
          IMAGE: ${{ needs.build.outputs.image_ref }}
          IMAGE_TAG: ${{ needs.build.outputs.version }}
          GIT_REF: ${{ needs.build.outputs.ref_name }}
          GIT_SHA: ${{ needs.build.outputs.commit_sha }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          workdir = Path(os.environ["RUNNER_TEMP"]) / "k8s-render"
          workdir.mkdir(parents=True, exist_ok=True)

          annotations = {
              "aide.gogaapps.io/git-ref": os.environ["GIT_REF"],
              "aide.gogaapps.io/git-sha": os.environ["GIT_SHA"],
              "aide.gogaapps.io/image-tag": os.environ["IMAGE_TAG"],
              "aide.gogaapps.io/image": os.environ["IMAGE"],
          }

          def annotation_block(indent):
              prefix = " " * indent
              return "\n".join(
                  f"{prefix}{key}: {json.dumps(value)}"
                  for key, value in annotations.items()
              )

          for src_name, target_name in {
              "k8s/configmap.yaml": workdir / "configmap.yaml",
              "k8s/deployment.yaml": workdir / "deployment.yaml",
          }.items():
              text = Path(src_name).read_text()
              if src_name == "k8s/deployment.yaml":
                  text = text.replace(
                      "  labels:\n    app.kubernetes.io/name: aide-bot",
                      "  labels:\n    app.kubernetes.io/name: aide-bot\n"
                      f"  annotations:\n{annotation_block(4)}",
                      1,
                  )
                  text = text.replace(
                      "    metadata:\n      labels:\n        app.kubernetes.io/name: aide-bot",
                      "    metadata:\n      labels:\n        app.kubernetes.io/name: aide-bot\n"
                      f"      annotations:\n{annotation_block(8)}",
                      1,
                  )
                  text = text.replace(
                      "image: ghcr.io/gogaapps/aide-bot:bootstrap",
                      f"image: {json.dumps(os.environ['IMAGE'])}",
                      1,
                  )

              target_name.write_text(text)
          PY

          kubectl apply -f "$RUNNER_TEMP/k8s-render/configmap.yaml"
          kubectl apply -f "$RUNNER_TEMP/k8s-render/deployment.yaml"

      - name: Deploy image
        env:
          IMAGE: ${{ needs.build.outputs.image_ref }}
        run: |
          set -Eeuo pipefail
          scripts/deploy-k8s.sh

      - name: Deployment summary
        run: |
          echo "Environment: ${{ github.event.inputs.environment || 'production' }}"
          echo "Image: ${{ needs.build.outputs.image_ref }}"
          echo "Namespace: $K8S_NAMESPACE"
          echo "Deployment: $K8S_DEPLOYMENT"
          echo "Git ref: ${{ needs.build.outputs.ref_name }}"
          echo "Git sha: ${{ needs.build.outputs.commit_sha }}"
