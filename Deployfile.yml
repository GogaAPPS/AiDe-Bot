format: 4
version: 0.2.0

metadata:
  name: aide-bot
  system: aide-bot
  lang: go
  lang_version: "1.24"
  deploy_to: k8s

spec:
  - data:
      common:
        image: "ghcr.io/gogaapps/aide-bot"

      deployment:
        replicas: 1
        namespace: apps
        request_cpu: 50
        limit_mem: 256

        opensearch_log_format: json

        env:
          SERVICE_NAME: aide-bot
          APP_NAME: aide-bot
          APP_ENV: "{{ values.environment }}"
          LOG_LEVEL: INFO
          BACKEND_API_BASE_URL: https://api-aide.icho.su
          BACKEND_MESSAGES_PATH: /api/v1/process
          BACKEND_STUB: "false"
          BACKEND_REQUEST_TIMEOUT: 45s
          MAX_API_BASE_URL: ""
          MAX_REQUEST_TIMEOUT: 45s
          MAX_POLLING_PAUSE: 500ms
          MAX_POLLING_TIMEOUT: 30s

  - subject:
      environment: ["preproduction"]
    data:
      deployment:
        replicas: 1
        env:
          APP_ENV: preproduction
          LOG_LEVEL: DEBUG

  - subject:
      environment: ["production"]
    data:
      deployment:
        replicas: 1
        env:
          APP_ENV: production
          LOG_LEVEL: INFO
